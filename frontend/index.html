<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BORSCH.</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f5ff',
              100: '#e0ebff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            accent: {
              pink: '#ec4899',
              purple: '#a855f7',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#f43f5e'
            }
          },
          animation: {
            'gradient-x': 'gradient-x 15s ease infinite',
            'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 4s ease-in-out infinite',
            'spin-slow': 'spin 12s linear infinite',
          },
          keyframes: {
            'gradient-x': {
              '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
              '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
            },
            'pulse-glow': {
              '0%, 100%': { opacity: '0.6', filter: 'drop-shadow(0 0 15px rgba(99, 102, 241, 0.6))' },
              '50%': { opacity: '1', filter: 'drop-shadow(0 0 25px rgba(168, 85, 247, 0.8))' },
            },
            'float': {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' },
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="antialiased selection:bg-brand-500 selection:text-white">

  <div class="fixed top-0 left-1/4 w-96 h-96 bg-brand-500/20 rounded-full blur-[120px] pointer-events-none animation-pulse-glow"></div>
  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-accent-purple/20 rounded-full blur-[120px] pointer-events-none animation-pulse-glow" style="animation-delay: 1s;"></div>

  <div class="flex h-screen overflow-hidden relative z-10">

    <aside id="sidebar" class="w-72 glass-panel border-r border-white/10 flex flex-col justify-between transition-all duration-300 z-30 relative shrink-0">
      <div>
        <div class="p-6 flex items-center justify-between border-b border-white/10">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 via-accent-purple to-accent-pink p-0.5 shadow-lg shadow-brand-500/30 animate-float">
              <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
                <i class="fa-solid font-bold fa-utensils text-xl text-white"></i>
              </div>
            </div>
            <div>
              <h1 class="font-display font-extrabold text-2xl tracking-tight glow-text">BORSCH.</h1>
              <p class="text-[10px] font-semibold tracking-widest uppercase text-brand-500">by SSSH Combo!</p>
            </div>
          </div>
        </div>

        <nav class="p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-230px)] tabs">
          <button data-tab="dashboard" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group relative active">
            <i class="fa-solid fa-chart-pie text-lg text-brand-500 group-hover:scale-110 transition-transform"></i>
            <span>Дашборд</span>
          </button>
          <button data-tab="stock" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-boxes-stacked text-lg text-emerald-400 group-hover:scale-110 transition-transform"></i>
            <span>Склад & Партии</span>
          </button>
          <button data-tab="products" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-book-open text-lg text-amber-400 group-hover:scale-110 transition-transform"></i>
            <span>Справочник</span>
          </button>
          <button data-tab="orders" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-cash-register text-lg text-indigo-400 group-hover:scale-110 transition-transform"></i>
            <span>Касса & Заказы</span>
          </button>
          <button data-tab="supplies" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-truck-ramp-box text-lg text-cyan-400 group-hover:scale-110 transition-transform"></i>
            <span>Приёмка поставок</span>
          </button>
          <button data-tab="schedule" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-calendar-days text-lg text-purple-400 group-hover:scale-110 transition-transform"></i>
            <span>График поставок</span>
          </button>
          <button data-tab="promotions" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-tags text-lg text-pink-400 group-hover:scale-110 transition-transform"></i>
            <span>Акции и скидки</span>
          </button>
          <button data-tab="stoplist" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-hand text-lg text-rose-500 group-hover:scale-110 transition-transform"></i>
            <span>Стоп-лист</span>
          </button>
          <button data-tab="hot" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-fire text-lg text-orange-400 group-hover:scale-110 transition-transform"></i>
            <span>Горячие</span>
          </button>
          <button data-tab="analytics" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-chart-line text-lg text-emerald-500 group-hover:scale-110 transition-transform"></i>
            <span>Аналитика</span>
          </button>
          <button data-tab="logs" class="tab w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5">
            <i class="fa-solid fa-list-check text-lg text-sky-400 group-hover:scale-110 transition-transform"></i>
            <span>Журнал событий</span>
          </button>
          <button data-tab="users" class="tab admin-only w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group text-slate-400 hover:text-white hover:bg-white/5" style="display:none">
            <i class="fa-solid fa-users-gear text-lg text-fuchsia-400 group-hover:scale-110 transition-transform"></i>
            <span>Пользователи</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-footer p-4 border-t border-white/10 space-y-3 bg-black/10">
        <button onclick="toggleTheme()" class="theme-toggle-btn w-full flex items-center justify-between px-4 py-2.5 rounded-xl glass-panel hover:bg-white/10 text-xs font-semibold transition-all">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-circle-half-stroke text-brand-500"></i>
            <span id="theme-label">Тёмная тема</span>
          </div>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-400">SHIFT + T</span>
        </button>
        <div class="flex items-center justify-between p-2.5 rounded-xl glass-panel">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-brand-500 to-accent-purple flex items-center justify-center font-bold text-white text-sm shadow-md">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="overflow-hidden">
              <div id="user-info" class="text-xs font-bold truncate">Гость</div>
              <div class="text-[10px] text-slate-400 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Онлайн</span>
              </div>
            </div>
          </div>
          <button onclick="doLogout()" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-colors" title="Выйти">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
        <span id="clock" class="clock text-xs text-slate-400 block text-center"></span>
      </div>
    </aside>
    <main class="main-content flex-1 flex flex-col h-screen overflow-hidden">
      <header class="topbar h-20 glass-panel border-b border-white/10 px-8 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-4">
          <h2 id="topbar-title" class="text-2xl font-display font-extrabold tracking-tight">Операционная сводка</h2>
        </div>

        <div class="flex items-center gap-3">
          <div id="topbar-actions"></div>
        </div>
      </header>
      <main id="main" class="flex-1 overflow-y-auto p-8 relative">
      </main>
    </main>
  </div>
  <div id="toast" class="toast fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 px-5 py-4 rounded-2xl glass-panel shadow-2xl border border-white/20 hidden">
    <div id="toast-icon" class="text-xl"></div>
    <div>
      <div id="toast-title" class="text-xs uppercase font-bold tracking-wider text-slate-400">Уведомление</div>
      <div id="toast-message" class="text-sm font-semibold"></div>
    </div>
  </div>

  <div id="global-modal" class="modal-backdrop fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-tabFadeIn" onclick="closeModal(event)">
    <div class="modal-content glass-panel w-full max-w-2xl rounded-3xl border border-white/20 shadow-2xl overflow-hidden transform transition-all scale-100" onclick="event.stopPropagation()">
      <div class="modal-header px-6 py-5 border-b border-white/10 flex items-center justify-between bg-white/5">
        <h3 id="modal-title" class="font-display font-bold text-xl glow-text">Заголовок</h3>
        <button onclick="closeModal()" class="close-btn w-8 h-8 rounded-full bg-white/10 hover:bg-rose-500/20 hover:text-rose-400 flex items-center justify-center transition-all">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <div id="modal-body" class="p-6 max-h-[80vh] overflow-y-auto">
      </div>
    </div>
  </div>

  <div id="login-overlay" class="login-overlay fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-xl" style="display:none;">
    <div class="login-box glass-panel w-full max-w-md p-8 rounded-3xl border border-white/20 shadow-2xl text-center space-y-6">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-500 via-accent-purple to-accent-pink p-0.5 mx-auto animate-float">
        <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center text-3xl">
          🔒
        </div>
      </div>
      <div>
        <h2 class="text-2xl font-display font-bold">Вход в BORSCH.</h2>
        <p class="text-xs text-slate-400 mt-1">Введите ваши данные авторизации: admin/admin or staff/staff</p>
      </div>

      <form onsubmit="doLogin(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Логин</label>
          <input type="text" id="login-input" required class="w-full px-4 py-3 rounded-xl glass-input font-medium" placeholder="admin">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Пароль</label>
          <input type="password" id="password-input" required class="w-full px-4 py-3 rounded-xl glass-input font-medium" placeholder="••••••••">
        </div>
        
        <div id="login-error" class="text-xs font-semibold text-rose-400 hidden bg-rose-500/10 p-3 rounded-xl border border-rose-500/20"></div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-600 via-accent-purple to-accent-pink text-white font-bold text-sm shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
          Войти в систему
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
</body>
</html>
